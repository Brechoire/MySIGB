{% extends "base.html" %}

{% block title %}Changer le mot de passe — MySIGB{% endblock %}

{% block content %}
<h1>Changer le mot de passe</h1>
<p>Pour des raisons de sécurité, veuillez définir un nouveau mot de passe.</p>
<form method="post">
    {% csrf_token %}
    <fieldset>
        <legend>Choisissez un nouveau mot de passe</legend>
        {{ form.as_p }}
    </fieldset>
    <button type="submit">Changer</button>
</form>
{% endblock %}
